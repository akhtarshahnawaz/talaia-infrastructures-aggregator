[package]
name = "talaia_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "talaia_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311 builds one wheel that works on CPython 3.11 and every later version.
# Without it the wheel is tagged for the exact interpreter that built it, so the
# Docker builder's Python and the runtime's Python must match exactly - a silent
# trap that makes the Rust core vanish into the NumPy fallback on deploy.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
