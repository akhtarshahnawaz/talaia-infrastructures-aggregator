[project]
name = "talaia"
version = "0.1.0"
description = "TALAIA - Territorial Asset Lookup & Aggregation for Infrastructure Awareness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.28", "duckdb>=1.1",
  "shapely>=2.0", "pydantic>=2.9", "pydantic-settings>=2.6", "numpy>=1.26",
  "orjson>=3.10", "rapidfuzz>=3.10", "openpyxl", "pandas",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
